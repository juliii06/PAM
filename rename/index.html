<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro</title>
<style>
    body { font-family: Arial, sans-serif; }
    .erro { color: red; margin-top: 10px; }
</style>
</head>
<body>

<h2>Cadastro de Usuário</h2>

<form id="formCadastro">
    <label>Nome:</label><br>
    <input type="text" id="nome"><br><br>

    <label>E-mail:</label><br>
    <input type="text" id="email"><br><br>

    <label>Idade:</label><br>
    <input type="text" id="idade"><br><br>

    <label>Senha:</label><br>
    <input type="password" id="senha"><br><br>

    <button type="submit">Cadastrar</button>
</form>

<div id="mensagem" class="erro"></div>

<script>
document.getElementById("formCadastro").addEventListener("submit", function(event) {

    event.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();
    const idade = document.getElementById("idade").value.trim();
    const senha = document.getElementById("senha").value;

    const mensagem = document.getElementById("mensagem");
    mensagem.innerHTML = "";

    try {

        if (nome.length < 3) {
            throw new Error("O nome deve possuir no mínimo 3 caracteres.");
        }

        if (!email.includes("@")) {
            throw new Error("E-mail inválido.");
        }

        if (isNaN(idade) || Number(idade) < 18) {
            throw new Error("A idade deve ser numérica e maior ou igual a 18.");
        }

        if (senha.length < 6) {
            throw new Error("A senha deve possuir no mínimo 6 caracteres.");
        }

        mensagem.style.color = "green";
        mensagem.innerHTML = "Cadastro realizado com sucesso!";

    } catch (erro) {

        mensagem.style.color = "red";
        mensagem.innerHTML = erro.message;

    }
});
</script>

</body>
</html>
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro Completo</title>

<style>
    body{
        font-family: Arial, sans-serif;
    }

    .erro{
        color:red;
        font-size:14px;
    }

    #listaErros{
        color:red;
        margin-bottom:15px;
    }
</style>
</head>
<body>

<h2>Cadastro</h2>

<div id="listaErros"></div>

<form id="formulario">

    <label>Nome:</label><br>
    <input type="text" id="nome">
    <div id="erroNome" class="erro"></div><br>

    <label>CPF:</label><br>
    <input type="text" id="cpf">
    <div id="erroCpf" class="erro"></div><br>

    <label>Data de Nascimento:</label><br>
    <input type="date" id="dataNascimento">
    <div id="erroData" class="erro"></div><br>

    <label>Senha:</label><br>
    <input type="password" id="senha">
    <div id="erroSenha" class="erro"></div><br>

    <label>Confirmar Senha:</label><br>
    <input type="password" id="confirmarSenha">
    <div id="erroConfirmar" class="erro"></div><br>

    <button type="submit">Cadastrar</button>

</form>

<script>

document.getElementById("formulario").addEventListener("submit", function(event){

    event.preventDefault();

    document.getElementById("listaErros").innerHTML = "";

    document.getElementById("erroNome").innerHTML = "";
    document.getElementById("erroCpf").innerHTML = "";
    document.getElementById("erroData").innerHTML = "";
    document.getElementById("erroSenha").innerHTML = "";
    document.getElementById("erroConfirmar").innerHTML = "";

    let erros = [];

    const nome = document.getElementById("nome").value.trim();
    const cpf = document.getElementById("cpf").value.trim();
    const dataNascimento = document.getElementById("dataNascimento").value;
    const senha = document.getElementById("senha").value;
    const confirmarSenha = document.getElementById("confirmarSenha").value;

    // Nome
    if(nome === ""){
        erros.push("Nome é obrigatório.");
        document.getElementById("erroNome").innerHTML =
        "Nome é obrigatório.";
    }

    // CPF
    if(!/^\d{11}$/.test(cpf)){
        erros.push("CPF deve conter 11 dígitos numéricos.");
        document.getElementById("erroCpf").innerHTML =
        "CPF deve conter 11 dígitos numéricos.";
    }

    // Data
    const hoje = new Date();
    const dataInformada = new Date(dataNascimento);

    if(dataNascimento === "" || dataInformada > hoje){
        erros.push("Data de nascimento inválida.");
        document.getElementById("erroData").innerHTML =
        "Data de nascimento não pode ser futura.";
    }

    // Senha
    if(senha.length < 6){
        erros.push("Senha deve possuir no mínimo 6 caracteres.");
        document.getElementById("erroSenha").innerHTML =
        "Senha deve possuir no mínimo 6 caracteres.";
    }

    // Confirmar senha
    if(confirmarSenha !== senha){
        erros.push("As senhas não coincidem.");
        document.getElementById("erroConfirmar").innerHTML =
        "As senhas não coincidem.";
    }

    // Exibir todos os erros
    if(erros.length > 0){

        let lista = "<ul>";

        erros.forEach(function(erro){
            lista += `<li>${erro}</li>`;
        });

        lista += "</ul>";

        document.getElementById("listaErros").innerHTML = lista;

    } else {

        document.getElementById("listaErros").innerHTML =
        "<span style='color:green'>Cadastro realizado com sucesso!</span>";

    }

});
</script>

</body>
</html>
